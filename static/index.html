<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Check if user is logged in
        if (!localStorage.getItem('token')) {
            window.location.href = '/wartegapp/login';
        }
    </script>
    <title>Lugh Backend | Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --sidebar-bg: #111827;
            --main-bg: #0b0e14;
            --card-bg: #1f2937;
            --primary: #10b981;
            --accent: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--main-bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        aside {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .brand { padding: 0 25px 30px; font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .nav-item {
            padding: 12px 25px;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover, .nav-item.active { background: #1f2937; color: var(--text-main); }
        .nav-item.active { border-right: 4px solid var(--primary); }

        /* Main Content */
        main { flex: 1; padding: 30px; overflow-y: auto; display: none; }
        main.active { display: block; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .status-badge { background: rgba(16, 185, 129, 0.1); color: var(--primary); padding: 5px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border); }
        .stat-label { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 8px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; }

        /* Terminal Style Logs */
        #log-window {
            background: #000;
            border-radius: 10px;
            padding: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            height: 500px;
            overflow-y: auto;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column-reverse;
        }
        .log-line { margin-bottom: 5px; color: #d1d5db; }

        /* Markdown Documentation */
        #docs-viewer {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 10px;
            line-height: 1.6;
            color: #d1d5db;
        }
        #docs-viewer h1, #docs-viewer h2 { color: var(--primary); margin: 20px 0 10px; }
        #docs-viewer code { background: #111827; padding: 2px 5px; border-radius: 4px; color: var(--accent); }
        #docs-viewer pre { background: #111827; padding: 20px; border-radius: 8px; overflow-x: auto; margin: 15px 0; }
    </style>
</head>
<body>
    <aside>
        <div class="brand">LUGH <span style="font-weight: 300; color: white;">BACKEND</span></div>
        <div class="nav-item active" onclick="showTab('overview')">Dashboard Overview</div>
        <div class="nav-item" onclick="showTab('logs')">Live System Logs</div>
        <div class="nav-item" onclick="showTab('docs')">API Documentation</div>
        <div class="nav-item" style="margin-top: auto;" onclick="logout()">Logout</div>
    </aside>

    <!-- TAB: OVERVIEW -->
    <main id="overview" class="active">
        <div class="header">
            <h2>System Overview</h2>
            <div class="status-badge">● API Online</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">System User</div>
                <div class="stat-value" id="stat-users">Admin</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Uptime</div>
                <div class="stat-value">99.9%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Environment</div>
                <div class="stat-value" style="color: var(--accent);">Production</div>
            </div>
        </div>
        <h3>Server Metrics</h3>
        <p style="color: var(--text-muted); margin-top: 10px;">Backend monitoring is active and healthy. Memory usage: 42MB</p>
    </main>

    <!-- TAB: LOGS -->
    <main id="logs">
        <div class="header">
            <h2>Live System Logs</h2>
            <button onclick="fetchLogs()" style="background: var(--primary); border: none; padding: 5px 15px; border-radius: 4px; color: #000; cursor: pointer; font-weight: 600;">Refresh</button>
        </div>
        <div id="log-window"></div>
    </main>

    <!-- TAB: DOCS -->
    <main id="docs">
        <div class="header">
            <h2>API Documentation</h2>
        </div>
        <div id="docs-viewer">Loading documentation...</div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

        function showTab(id) {
            document.querySelectorAll('main').forEach(m => m.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
            
            if (id === 'docs') fetchDocs();
            if (id === 'logs') fetchLogs();
        }

        async function fetchLogs() {
            try {
                const res = await fetch('/api/monitor/logs', { headers });
                const logs = await res.json();
                document.getElementById('log-window').innerHTML = logs.map(l => `<div class="log-line">${l}</div>`).join('');
            } catch (err) { console.error(err); }
        }

        async function fetchDocs() {
            try {
                const res = await fetch('/api/monitor/docs', { headers });
                const text = await res.text();
                document.getElementById('docs-viewer').innerHTML = marked.parse(text);
            } catch (err) { console.error(err); }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/wartegapp/login';
        }

        // Initialize
        setInterval(fetchLogs, 5000);
    </script>
</body>
</html>
