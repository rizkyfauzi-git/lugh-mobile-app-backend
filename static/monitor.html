<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warteg System | Monitoring Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --accent: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .income { color: var(--success); }
        .expense { color: var(--danger); }

        .charts-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }

        .table-container {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            text-align: left;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        td {
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.9rem;
        }

        .footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Warteg System <span style="font-weight: 300; opacity: 0.7;">Monitor</span></h1>
            <div class="status-badge">
                <div class="dot"></div> Server Online
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <div class="card-label">Total Pemasukan</div>
                <div class="card-value income" id="total-income">Rp 0</div>
            </div>
            <div class="card">
                <div class="card-label">Total Pengeluaran</div>
                <div class="card-value expense" id="total-expense">Rp 0</div>
            </div>
            <div class="card">
                <div class="card-label">Saldo Saat Ini</div>
                <div class="card-value" id="balance">Rp 0</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="table-container">
                <h3>Transaksi Terakhir</h3>
                <table>
                    <thead>
                        <tr>
                            <th>TANGGAL</th>
                            <th>DESKRIPSI</th>
                            <th>KATEGORI</th>
                            <th>JUMLAH</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
            <div class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <h3 style="margin-bottom: 1rem;">Rasio Keuangan</h3>
                <canvas id="financeChart"></canvas>
            </div>
        </div>

        <div class="footer">
            &copy; 2026 Warteg System Backend Monitoring. Built with Go & Gin.
        </div>
    </div>

    <script>
        // Note: In production, you'd handle auth. 
        // For this dashboard, we'll fetch from the public summary endpoint if available 
        // or prompt for token for this demo context.
        
        async function loadData() {
            try {
                // Fetch summary (Assuming token is stored in localStorage or handled via cookie)
                const token = localStorage.getItem('token');
                const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

                const summaryRes = await fetch('/api/transactions/summary', { headers });
                const summary = await summaryRes.json();

                document.getElementById('total-income').innerText = `Rp ${summary.total_income.toLocaleString()}`;
                document.getElementById('total-expense').innerText = `Rp ${summary.total_expense.toLocaleString()}`;
                document.getElementById('balance').innerText = `Rp ${summary.balance.toLocaleString()}`;

                // Update Chart
                updateChart(summary.total_income, summary.total_expense);

                // Fetch Transactions
                const transRes = await fetch('/api/transactions', { headers });
                const transactions = await transRes.json();
                
                const list = document.getElementById('transaction-list');
                list.innerHTML = '';
                transactions.slice(0, 8).forEach(t => {
                    const date = new Date(t.date).toLocaleDateString();
                    list.innerHTML += `
                        <tr>
                            <td>${date}</td>
                            <td>${t.description || '-'}</td>
                            <td>${t.category.name}</td>
                            <td class="${t.type === 'income' ? 'income' : 'expense'}">
                                ${t.type === 'income' ? '+' : '-'} Rp ${t.amount.toLocaleString()}
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Failed to fetch monitoring data", err);
            }
        }

        let myChart;
        function updateChart(income, expense) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pemasukan', 'Pengeluaran'],
                    datasets: [{
                        data: [income, expense],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom',
                            labels: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        // Auto Refresh every 30 seconds
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
