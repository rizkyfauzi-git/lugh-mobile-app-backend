<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warteg System | Log Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --primary: #4ade80;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --log-bg: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { font-size: 1.5rem; color: var(--primary); }

        .status-badge {
            font-size: 0.8rem;
            background: rgba(74, 222, 128, 0.1);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 4px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .log-container {
            flex: 1;
            background-color: var(--log-bg);
            border-radius: 8px;
            padding: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            overflow-y: auto;
            border: 1px solid #2d3748;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column-reverse; /* Show newest at bottom, auto scroll */
        }

        .log-entry {
            margin-bottom: 4px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-time { color: #569cd6; margin-right: 10px; }
        .log-method { color: #ce9178; font-weight: bold; }
        .log-path { color: #dcdcdc; }
        .log-status { color: #4ec9b0; }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            background: #2d3748;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        button:hover { background: #4a5568; }
    </style>
</head>
<body>
    <header>
        <h1>System Live Logs</h1>
        <div class="status-badge" id="status">Streaming Live</div>
    </header>

    <div class="log-container" id="log-box">
        <!-- Logs will appear here -->
    </div>

    <div class="controls">
        <button onclick="fetchLogs()">Manual Refresh</button>
        <button onclick="clearLogs()">Clear View</button>
    </div>

    <script>
        async function fetchLogs() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/monitor/logs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.status === 401) {
                    document.getElementById('log-box').innerHTML = '<div style="color:red">Error: Unauthorized. Please login first.</div>';
                    return;
                }

                const logs = await res.json();
                const logBox = document.getElementById('log-box');
                
                // Process and format logs
                const formattedLogs = logs.map(line => {
                    return `<div class="log-entry">${escapeHtml(line)}</div>`;
                }).join('');

                logBox.innerHTML = formattedLogs;
            } catch (err) {
                console.error("Failed to fetch logs", err);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLogs() {
            document.getElementById('log-box').innerHTML = '';
        }

        // Auto refresh every 3 seconds
        fetchLogs();
        setInterval(fetchLogs, 3000);
    </script>
</body>
</html>
