<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugh Backend | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card: #151921;
            --primary: #10b981;
            --text: #f3f4f6;
            --input-bg: #0b0e14;
            --border: #2d3748;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--card);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 30px; }
        h1 { font-size: 1.2rem; margin-bottom: 25px; font-weight: 600; }

        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; }
        
        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            color: white;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1); }

        button {
            width: 100%;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover { transform: translateY(-2px); opacity: 0.9; }

        .error { color: #ef4444; font-size: 0.85rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">LUGH <span style="font-weight: 300; color: white;">BACKEND</span></div>
        <h1>Control Panel Login</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" id="username" placeholder="Masukkan email Anda" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btn-login">Sign In</button>
        </form>

        <div id="errorMessage" class="error">Username atau password salah!</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const err = document.getElementById('errorMessage');
            
            btn.innerText = 'Signing in...';
            err.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/wartegapp';
                } else {
                    err.style.display = 'block';
                    btn.innerText = 'Sign In';
                }
            } catch (error) {
                err.innerText = 'Koneksi server gagal!';
                err.style.display = 'block';
                btn.innerText = 'Sign In';
            }
        });
    </script>
</body>
</html>
